<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>谷歌猪 · 动作场景预览</title>
<style>
  body {
    margin: 0; padding: 24px; background: #2b2b30; color: #e8e8ea;
    font: 14px/1.5 "Microsoft YaHei", system-ui, sans-serif;
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  p.note { margin: 0 0 20px; color: #9aa0a6; font-size: 12px; }
  .grid { display: flex; flex-wrap: wrap; gap: 18px; }
  .cell { width: 180px; }
  .stage {
    width: 180px; height: 180px; border-radius: 12px; display: grid; place-items: center;
    /* 棋盘格背景，方便看透明区域和是否贴边 */
    background-image:
      linear-gradient(45deg, #3a3a41 25%, transparent 25%),
      linear-gradient(-45deg, #3a3a41 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #3a3a41 75%),
      linear-gradient(-45deg, transparent 75%, #3a3a41 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    background-color: #46464e;
  }
  .stage.light { background-color: #f4f1ee; }
  img { width: 160px; height: 160px; display: block; image-rendering: auto; }
  .cap { margin-top: 6px; font-size: 12px; color: #cfcfd4; }
  .cap b { color: #ffd1af; }
</style>
</head>
<body>
  <h1>谷歌猪 · 5 个动作场景</h1>
  <p class="note">全部由 <code>piglet.svg</code> 派生：身体逐位复用，只换表情、加道具。棋盘格用来检查透明与贴边。</p>
  <div class="grid" id="g"></div>
<script>
  const scenes = [
    ['piglet.svg',       'idle',  '待机'],
    ['piglet-eat.svg',   'eat',   '进食'],
    ['piglet-bathe.svg', 'bathe', '洗澡'],
    ['piglet-play.svg',  'play',  '玩耍'],
    ['piglet-pet.svg',   'pet',   '摸头'],
    ['piglet-relax.svg', 'relax', '打盹'],
  ];
  document.getElementById('g').innerHTML = scenes.map(([f, k, cn], i) => `
    <div class="cell">
      <div class="stage ${i % 2 ? 'light' : ''}"><img src="src/assets/${f}" alt="${cn}"></div>
      <div class="cap"><b>${k}</b> · ${cn}</div>
    </div>`).join('');
</script>
</body>
</html>
